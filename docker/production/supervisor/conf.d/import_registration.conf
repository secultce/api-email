[program:import_registration]
process_name=%(program_name)s_%(process_num)02d

directory=/var/www/html

command=php artisan rabbitmq:import-registration-command

autostart=true
autorestart=true

startsecs=5
startretries=10

numprocs=1

stopwaitsecs=60
stopsignal=TERM

redirect_stderr=true

stdout_logfile=/var/log/supervisor/import_registration.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
